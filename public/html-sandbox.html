<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Sandboxed HTML</title>
    <style>
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
      iframe { display: block; width: 100%; height: 100%; border: 0; }
    </style>
  </head>
  <body>
    <script>
      let initialized = false
      addEventListener("message", (event) => {
        if (initialized || event.source !== parent || event.origin !== `chrome-extension://${location.host}` ||
            event.data?.type !== "RENDER_HTML" || typeof event.data.html !== "string") return
        initialized = true
        const frame = document.createElement("iframe")
        frame.title = "HTML document"
        frame.setAttribute("sandbox", "allow-scripts")
        frame.srcdoc = event.data.html
        document.body.appendChild(frame)
        parent.postMessage({ type: "SNAPLAYER_HTML_READY" }, event.origin)
      })
    </script>
  </body>
</html>
